name: Track vm2api releases and publish quota image

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: Official release tag to build (blank uses latest)
        type: string
      publish:
        description: Publish to GHCR after verification
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: vm2api-quota-image
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'Hibanaw/vm2api' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      image_tag: ${{ steps.patch.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          path: fork
      - name: Select official release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.upstream_tag }}
        run: |
          set -euo pipefail
          tag="${REQUESTED_TAG}"
          if [[ -n "$tag" ]]; then
            [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
            endpoint="tags/$tag"
          else
            endpoint=latest
          fi
          tag=$(gh api "repos/dofastted/vm2api/releases/$endpoint" \
            --jq 'select(.draft == false and .prerelease == false) | .tag_name')
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: dofastted/vm2api
          ref: refs/tags/${{ steps.release.outputs.tag }}
          persist-credentials: false
          path: upstream
      - name: Apply fork changes to the release
        id: patch
        env:
          UPSTREAM_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          baseline=a5f88bf4919b55cfc355016cf7c65150cec807a0 # v1.4.214
          patch_head=HEAD
          if [[ $(printf '%s\n' v1.4.214 "$UPSTREAM_TAG" | sort -V | head -1) != v1.4.214 ]]; then
            # Manual builds of older releases use the patch from before this merge.
            baseline=a63ce9a3708d40ca33ee4fc6b5d3bdd48a181698
            patch_head=113a673a7a76082dd9850898c62b2514b8c46d83
          fi
          backend=(
            src/lib/pool/credential-weight.mjs
            src/lib/pool/pool-scheduler.mjs
            src/lib/admin/panel-api.mjs
            src/lib/admin/release.mjs
            scripts/panel-upgrade.sh
          )
          git -C fork merge-base --is-ancestor "$baseline" "$patch_head"
          git -C fork -c core.abbrev=12 diff --binary -U1 "$baseline" "$patch_head" -- \
            "${backend[@]}" \
            web/src/features/settings/pool-pane.tsx \
            web/src/features/settings/pool-live-panel.tsx \
            web/src/types/panel-vm.ts \
            web/src/features/settings/about-pane.tsx \
            web/src/components/layout/app-title.tsx \
            test/unit/pool-scheduler.test.mjs \
            test/unit/release.test.mjs > "$RUNNER_TEMP/quota.patch"
          test -s "$RUNNER_TEMP/quota.patch"
          test "v$(tr -d '[:space:]' < upstream/VERSION)" = "$UPSTREAM_TAG"
          mkdir -p image
          (cd upstream && sha256sum "${backend[@]}") > image/base-files.sha256
          git -C upstream apply --check "$RUNNER_TEMP/quota.patch"
          git -C upstream apply "$RUNNER_TEMP/quota.patch"
          commit=$(git -C upstream rev-parse HEAD)
          revision=$(cat "$RUNNER_TEMP/quota.patch" fork/deploy/Dockerfile.quota | sha256sum | cut -c1-12)
          echo "image_tag=${UPSTREAM_TAG}-quota.${revision}" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$commit" > image/upstream-commit
          for file in "${backend[@]}"; do
            install -Dm644 "upstream/$file" "image/$file"
          done
          cp fork/deploy/Dockerfile.quota image/Dockerfile
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Test scheduler and seat planner
        working-directory: upstream
        run: |
          npm ci --no-audit --no-fund
          node --test test/unit/pool-scheduler.test.mjs test/unit/seat-planner.test.mjs test/unit/release.test.mjs
          sh -n scripts/panel-upgrade.sh
          bash -n "$GITHUB_WORKSPACE/fork/deploy/upgrade-quota.sh"
      - name: Build console
        working-directory: upstream/web
        env:
          VITE_VM2API_QUOTA_CHANNEL: '1'
        run: |
          npm exec --yes --package=pnpm@10.30.0 -- pnpm install --frozen-lockfile
          npm exec --yes --package=pnpm@10.30.0 -- pnpm build
          cp -R dist "$GITHUB_WORKSPACE/image/web-dist"
      - uses: actions/upload-artifact@v7
        with:
          name: quota-image-context
          path: image
          if-no-files-found: error
          retention-days: 2

  image:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      packages: write
    env:
      UPSTREAM_TAG: ${{ needs.verify.outputs.tag }}
      IMAGE_TAG: ${{ needs.verify.outputs.image_tag }}
      PUBLISH: ${{ github.event_name == 'schedule' || inputs.publish }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: quota-image-context
          path: image
      - uses: docker/login-action@v4
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and verify amd64 image
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image="ghcr.io/$owner/vm2api-quota:$IMAGE_TAG-amd64"
          if [[ "$PUBLISH" == true ]] && docker buildx imagetools inspect "$image" >/dev/null 2>&1; then
            echo "$image is already published" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          upstream="ghcr.io/dofastted/vm2api"
          ref="$upstream:$UPSTREAM_TAG-amd64"
          if ! docker pull --platform linux/amd64 "$ref"; then
            ref="$upstream:$UPSTREAM_TAG"
            docker pull --platform linux/amd64 "$ref"
          fi
          digest=$(docker image inspect --format '{{index .RepoDigests 0}}' "$ref")
          cid=$(docker create --platform linux/amd64 "$digest")
          trap 'docker rm "$cid" >/dev/null' EXIT
          mkdir "$RUNNER_TEMP/base"
          docker cp "$cid:/opt/vm2api/src" "$RUNNER_TEMP/base/src"
          mkdir -p "$RUNNER_TEMP/base/scripts"
          docker cp "$cid:/opt/vm2api/scripts/panel-upgrade.sh" "$RUNNER_TEMP/base/scripts/"
          (cd "$RUNNER_TEMP/base" && sha256sum --check "$GITHUB_WORKSPACE/image/base-files.sha256")
          docker build --platform linux/amd64 --build-arg "UPSTREAM_IMAGE=$digest" \
            --build-arg "QUOTA_IMAGE_TAG=$IMAGE_TAG-amd64" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.base.name=$ref" \
            --label "org.opencontainers.image.version=$IMAGE_TAG" \
            --tag "$image" image
          docker run --rm --network none --entrypoint node "$image" --input-type=module -e \
            'import assert from "node:assert/strict"; import { normalizePoolRouting } from "./src/lib/pool/pool-scheduler.mjs"; assert.equal(normalizePoolRouting({strategy: "weekly_pace"}).strategy, "weekly_pace")'
          if [[ "$PUBLISH" == true ]]; then
            docker push "$image"
            echo "Published \`$image\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Verified \`$image\` (local build only)" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Publish fork release after image is available
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$IMAGE_TAG-amd64"
          package="${GITHUB_REPOSITORY_OWNER,,}/vm2api-quota"
          registry_token=$(curl -fsS --max-time 20 "https://ghcr.io/token?service=ghcr.io&scope=repository:$package:pull" | jq -er .token)
          echo "::add-mask::$registry_token"
          curl -fsS --max-time 20 -o /dev/null \
            -H "Authorization: Bearer $registry_token" \
            -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.docker.distribution.manifest.v2+json' \
            "https://ghcr.io/v2/$package/manifests/$tag"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest=false \
              --title "vm2api quota $UPSTREAM_TAG (amd64)" \
              --notes "Image: ghcr.io/$package:$tag. Upstream: https://github.com/dofastted/vm2api/releases/tag/$UPSTREAM_TAG"
          fi
          current=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>/dev/null || true)
          if [[ "$current" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-quota\.[a-f0-9]{12}-amd64$ ]]; then
            current_version="${current%%-quota.*}"
            [[ $(printf '%s\n' "$current_version" "$UPSTREAM_TAG" | sort -V | tail -1) == "$UPSTREAM_TAG" ]] || exit 0
          fi
          latest_commit=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$GITHUB_REF_NAME" --jq .object.sha)
          [[ "$latest_commit" != "$GITHUB_SHA" ]] || gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --latest
