name: Track vm2api releases and publish quota image

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: Official release tag to build (blank uses latest)
        type: string
      publish:
        description: Publish to GHCR after verification
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: vm2api-quota-image
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'Hibanaw/vm2api'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      image_tag: ${{ steps.patch.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          path: fork
      - name: Select official release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.upstream_tag }}
        run: |
          set -euo pipefail
          tag="${REQUESTED_TAG}"
          if [[ -n "$tag" ]]; then
            [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
            endpoint="tags/$tag"
          else
            endpoint=latest
          fi
          tag=$(gh api "repos/dofastted/vm2api/releases/$endpoint" \
            --jq 'select(.draft == false and .prerelease == false) | .tag_name')
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: dofastted/vm2api
          ref: refs/tags/${{ steps.release.outputs.tag }}
          persist-credentials: false
          path: upstream
      - name: Apply fork changes to the release
        id: patch
        env:
          UPSTREAM_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          baseline=a63ce9a3708d40ca33ee4fc6b5d3bdd48a181698
          backend=(
            src/lib/pool/credential-weight.mjs
            src/lib/pool/pool-scheduler.mjs
            src/lib/admin/panel-api.mjs
          )
          git -C fork merge-base --is-ancestor "$baseline" HEAD
          git -C fork diff --binary -U1 "$baseline" HEAD -- \
            "${backend[@]}" \
            web/src/features/settings/pool-pane.tsx \
            web/src/features/settings/pool-live-panel.tsx \
            web/src/types/panel-vm.ts \
            test/unit/pool-scheduler.test.mjs > "$RUNNER_TEMP/quota.patch"
          test -s "$RUNNER_TEMP/quota.patch"
          test "v$(tr -d '[:space:]' < upstream/VERSION)" = "$UPSTREAM_TAG"
          mkdir -p image
          (cd upstream && sha256sum "${backend[@]}") > image/base-files.sha256
          git -C upstream apply --check "$RUNNER_TEMP/quota.patch"
          git -C upstream apply "$RUNNER_TEMP/quota.patch"
          commit=$(git -C upstream rev-parse HEAD)
          revision=$(cat "$RUNNER_TEMP/quota.patch" fork/deploy/Dockerfile.quota | sha256sum | cut -c1-12)
          echo "image_tag=${UPSTREAM_TAG}-quota.${revision}" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$commit" > image/upstream-commit
          for file in "${backend[@]}"; do
            install -Dm644 "upstream/$file" "image/$file"
          done
          cp fork/deploy/Dockerfile.quota image/Dockerfile
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Test scheduler and seat planner
        working-directory: upstream
        run: |
          npm ci --no-audit --no-fund
          node --test test/unit/pool-scheduler.test.mjs test/unit/seat-planner.test.mjs
      - name: Build console
        working-directory: upstream/web
        run: |
          npm exec --yes --package=pnpm@10.30.0 -- pnpm install --frozen-lockfile
          npm exec --yes --package=pnpm@10.30.0 -- pnpm build
          cp -R dist "$GITHUB_WORKSPACE/image/web-dist"
      - uses: actions/upload-artifact@v7
        with:
          name: quota-image-context
          path: image
          if-no-files-found: error
          retention-days: 2

  image:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      UPSTREAM_TAG: ${{ needs.verify.outputs.tag }}
      IMAGE_TAG: ${{ needs.verify.outputs.image_tag }}
      PUBLISH: ${{ github.event_name == 'schedule' || inputs.publish }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: quota-image-context
          path: image
      - uses: docker/login-action@v4
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and verify amd64 image
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image="ghcr.io/$owner/vm2api-quota:$IMAGE_TAG-amd64"
          if [[ "$PUBLISH" == true ]] && docker buildx imagetools inspect "$image" >/dev/null 2>&1; then
            echo "$image is already published" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          upstream="ghcr.io/dofastted/vm2api"
          ref="$upstream:$UPSTREAM_TAG-amd64"
          if ! docker pull --platform linux/amd64 "$ref"; then
            ref="$upstream:$UPSTREAM_TAG"
            docker pull --platform linux/amd64 "$ref"
          fi
          digest=$(docker image inspect --format '{{index .RepoDigests 0}}' "$ref")
          cid=$(docker create --platform linux/amd64 "$digest")
          trap 'docker rm "$cid" >/dev/null' EXIT
          mkdir "$RUNNER_TEMP/base"
          docker cp "$cid:/opt/vm2api/src" "$RUNNER_TEMP/base/src"
          (cd "$RUNNER_TEMP/base" && sha256sum --check "$GITHUB_WORKSPACE/image/base-files.sha256")
          docker build --platform linux/amd64 --build-arg "UPSTREAM_IMAGE=$digest" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.base.name=$ref" \
            --label "org.opencontainers.image.version=$IMAGE_TAG" \
            --tag "$image" image
          docker run --rm --network none --entrypoint node "$image" --input-type=module -e \
            'import assert from "node:assert/strict"; import { normalizePoolRouting } from "./src/lib/pool/pool-scheduler.mjs"; assert.equal(normalizePoolRouting({strategy: "weekly_pace"}).strategy, "weekly_pace")'
          if [[ "$PUBLISH" == true ]]; then
            docker push "$image"
            echo "Published \`$image\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Verified \`$image\` (local build only)" >> "$GITHUB_STEP_SUMMARY"
          fi
